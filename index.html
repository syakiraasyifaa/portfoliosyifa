<!-- Custom CSS -->
    <style>
        body { background-color: #F1EFE8; color: #102C33; overflow-x: hidden; }
        .nav-scrolled { background-color: rgba(241, 239, 232, 0.95) !important; backdrop-filter: blur(10px) !important; border-bottom: 3px solid #102C33; box-shadow: 0 4px 20px rgba(16, 44, 51, 0.1); }
        .bold-card { background-color: #ffffff; border: 3px solid #102C33; border-radius: 1rem; box-shadow: 6px 6px 0px 0px #102C33; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .bold-card:hover { transform: translate(-4px, -4px); box-shadow: 10px 10px 0px 0px #102C33; }
        .modal-brutal { border: 4px solid #102C33; box-shadow: 12px 12px 0px 0px #102C33; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #004F54; border-radius: 4px; border: 2px solid #F1EFE8; }

        .editable-tag-img { cursor: pointer; transition: opacity 0.2s; }
        .editable-tag-img:hover { opacity: 0.6; }
        .admin-mode-active .editable-tag-img { outline: 2px dashed #E45E32; }
        .admin-mode-active .editable-tag-text { cursor: pointer; }
        .admin-mode-active .editable-tag-text:hover { text-decoration: underline; text-decoration-style: dashed; color: #E45E32; }

        button[onclick^="edit"], button[onclick^="add"], button[onclick^="trigger"], button[onclick^="delete"] { transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1) !important; cursor: pointer; }
        button[onclick^="edit"]:hover, button[onclick^="add"]:hover, button[onclick^="trigger"]:hover, button[onclick^="delete"]:hover { background-color: #E45E32 !important; color: #102C33 !important; border-color: #102C33 !important; transform: translate(-3px, -3px) !important; box-shadow: 4px 4px 0px 0px #102C33 !important; z-index: 50 !important; opacity: 1 !important; }

        .loader-overlay { position: fixed; inset: 0; background: rgba(241, 239, 232, 0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { border: 6px solid #F1EFE8; border-top: 6px solid #4FB3B3; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .text-highlight { color: #E45E32; text-shadow: 2px 2px 0px #102C33; }
        
        /* Skills whitespace for bullets */
        .skill-desc-text { white-space: pre-line; }
        /* Animasi Marquee Carousel */
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-marquee { animation: scroll-left 40s linear infinite; }
        .animate-marquee:hover { animation-play-state: paused; } /* Berhenti saat disorot mouse */
        .carousel-item { width: 320px; height: 220px; flex-shrink: 0; position: relative; margin-right: 1.5rem; border: 3px solid #102C33; border-radius: 12px; overflow: hidden; box-shadow: 6px 6px 0px 0px #102C33; background: #fff; }
        
        p { text-align: justify; }
        .skill-desc, .line-clamp-3, #heroDescText, #bioP1, #bioP2, #visionDesc {
            text-align: justify;
            text-justify: inter-word;
        }
    </style>
